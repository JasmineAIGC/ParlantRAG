[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "parlant-rag"
version = "0.1.0"
description = "RAG module for Parlant — SDK-native retrieval and LLM evaluation"
requires-python = ">=3.10"
dependencies = [
    "parlant",
    "litellm>=1.40.0",
    "python-dotenv>=1.0.0",
    "faiss-cpu>=1.8.0",
    "httpx>=0.27.0",
    "openai>=1.0.0",
]

[project.optional-dependencies]
local = ["sentence-transformers>=3.0.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["rag_module*", "parlant_rag*", "model_client*"]
