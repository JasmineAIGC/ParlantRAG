[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "parlant-rag"
version = "0.1.0"
description = "RAG module for Parlant — FlexRAG-backed retrieval and LLM evaluation"
requires-python = ">=3.10"
dependencies = [
    "litellm>=1.40.0",
    "python-dotenv>=1.0.0",
    "llama-index>=0.11.0",
    "llama-index-vector-stores-faiss>=0.3.0",
    "faiss-cpu>=1.8.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
parlant = ["parlant"]

[tool.setuptools.packages.find]
where = ["."]
include = ["rag_module*"]
